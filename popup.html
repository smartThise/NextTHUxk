<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --ink: #212120;
  --ink-soft: #50504b;
  --line: rgba(33,33,32,.12);
  --accent: #212120;
}
body {
  width: 280px;
  font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", sans-serif;
  padding: 18px 20px 20px;
  color: var(--ink);
  background: #f7f7f5;
}
.othu-logo {
  display: inline-grid;
  grid-template-columns: auto auto auto auto auto;
  line-height: 1;
  text-align: center;
}
.othu-logo .lp {
  font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
  font-weight: 400;
  transform: scaleY(1.06);
}
.othu-logo .word {
  grid-column: 2 / 5;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: Georgia, "Playfair Display", "Times New Roman", serif;
  font-weight: 500;
  font-size: 1.14em;
  letter-spacing: -.035em;
  line-height: 1;
}
.othu-logo .word i { font-style: normal; display: block; }
.othu-logo .tu {
  font-family: Inter, "SF Pro Display", "Helvetica Neue", system-ui, -apple-system, sans-serif;
  font-weight: 800;
  letter-spacing: -.01em;
}
.logo {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--ink);
}
.sub { font-size: 11px; color: var(--ink-soft); margin: 3px 0 14px; letter-spacing: .08em; }
.status {
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 14px;
  padding: 9px 12px;
  border-radius: 12px;
  background: rgba(255,255,255,.5);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(29,31,36,.05), 0 2px 12px rgba(29,31,36,.06);
}
.status.ok { color: #07c160; }
.status.err { color: #ee4d4d; }
.btn {
  display: block;
  width: 100%;
  padding: 11px;
  border-radius: 14px;
  background: rgba(255,255,255,.5);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  color: var(--ink);
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: .04em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(29,31,36,.07), 0 6px 24px rgba(29,31,36,.12);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:hover {
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(29,31,36,.07), 0 10px 30px rgba(29,31,36,.16);
}
.btn:active { transform: translateY(0); }
/* OneGUI 石墨：实面、细分隔与深色主操作。 */
.status { background: #fff; border: 1px solid var(--line); box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
.status.ok { color: #18734b; }
.status.err { color: #b42332; }
.btn { background: #212120; color: #fff; border-radius: 10px; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
.btn:hover { background: #383835; transform: none; box-shadow: none; }
.btn:focus-visible { outline: 2px solid #50504b; outline-offset: 3px; }
</style>
</head>
<body>
<div class="logo"><span class="othu-logo" style="font-size:15px"><span class="lp">(</span><span class="word"><i>O</i><i>n</i><i>e</i></span><span></span><span class="lp"> </span><span class="tu">T</span><span class="tu">H</span><span class="tu">U</span><span class="lp">)</span></span>NextTHUxk</div>
<div class="sub">下一代选课 · AI 智能辅助</div>
<div id="status" class="status">检测中…</div>
<button class="btn" id="launch">启动选课工作台</button>
<script src="popup.js"></script>
</body>
</html>
